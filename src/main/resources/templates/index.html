<!DOCTYPE html>
<html>
<head>
<title>Ecommerce</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Add Product</h2>
<form action="/add" method="post" style="max-width:300px;">
<input class="form-control mb-2" name="name" placeholder="Name">
<input class="form-control mb-2" name="price" placeholder="Price">
<button class="btn btn-primary w-100">Add</button>
</form>

<h2>Products</h2>
<div th:each="p : ${products}" class="border p-2 mb-2">
<b th:text="${p.name}"></b> - ₹<span th:text="${p.price}"></span>
</div>
</body>
</html>
